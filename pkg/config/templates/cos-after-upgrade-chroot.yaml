# yip stage to overwrite after-install-chroot layout
if: '[ ! -f "/run/cos/recovery_mode" ]'
name: "Run after-upgrade-chroot commands"
commands:
    {{- if .OS.AfterUpgradeChrootCommands }}
    {{- range $cmd := .OS.AfterUpgradeChrootCommands }}
    - {{ printf "%q" $cmd }}
    {{- end }}
    {{- end }}
